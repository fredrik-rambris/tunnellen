name: Java CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    # The release commit itself is tagged "[skip-ci] prepare release vX" (see
    # pom.xml's scmCommentPrefix) to avoid a redundant build when that commit
    # lands on master via a plain branch push -- but a tag push (the actual
    # release trigger) must still build regardless of that message, or the
    # release job below (which needs this one) never runs.
    if: "!contains(github.event.head_commit.message, '[skip-ci]') || startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Compile and Test
        run: mvn clean verify

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build JAR
        run: mvn package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/tunnellen-*.jar
